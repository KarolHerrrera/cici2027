# Blueprint de Render para el portal oficial CICI 2027 (Universidad Mariana)
# Despliega el contenedor Docker junto con la base de datos PostgreSQL conectada y poblada automáticamente.
services:
  - type: web
    name: cici2027
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "CICI 2027 · Universidad Mariana"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: cici2027-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEEDERS
        value: "true"

databases:
  - name: cici2027-db
    plan: free
